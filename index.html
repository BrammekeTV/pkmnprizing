<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Prijzentool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261028b">
  <script src="calculator.js?v=20261028b" defer></script>
  <script src="app.js?v=20261028b" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Prijzentool</h1>
        <p>Bereken prijzen en marge voor je Pokémon-toernooi.</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="reset-button" class="button quiet">Standaardwaarden</button>
      <button type="button" id="theme-toggle" class="button quiet" aria-label="Schakel donkere modus">Donker</button>
    </div>
  </header>

  <main class="layout">
    <form id="calculator-form" class="panel settings" novalidate>
      <fieldset class="group">
        <legend>Toernooi</legend>
        <div class="field-grid">
          <label class="field">
            <span class="field-label">Aantal spelers</span>
            <input id="players" name="players" type="number" inputmode="numeric" min="1" step="1" value="20" required>
            <span class="hint">Minimaal 4</span>
          </label>
          <label class="field">
            <span class="field-label">Inleggeld per speler</span>
            <span class="input-affix">
              <span class="affix" aria-hidden="true">€</span>
              <input id="entry-fee" name="entry-fee" type="text" inputmode="decimal" value="15.00" required>
            </span>
          </label>
          <label class="field field-wide">
            <span class="field-label">Top-cut</span>
            <input id="top-cut" name="top-cut" type="number" inputmode="numeric" min="1" step="1" value="4" required>
            <span class="hint">Aantal plekken dat extra prijzen krijgt</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Prijzen</legend>
        <div class="field-grid">
          <label class="field">
            <span class="field-label">Inkoop per booster</span>
            <span class="input-affix">
              <span class="affix" aria-hidden="true">€</span>
              <input id="booster-cost" name="booster-cost" type="text" inputmode="decimal" value="5.00" required>
            </span>
            <span class="hint">Wat jij per booster betaalt</span>
          </label>
          <label class="field">
            <span class="field-label">Deelnameprijs</span>
            <input id="participation-boosters" name="participation-boosters" type="number" inputmode="numeric" min="0" step="1" value="1" required>
            <span class="hint">Boosters per speler buiten de top-cut</span>
          </label>
          <label class="field field-wide">
            <span class="field-label">Prijspakketten per plek</span>
            <select id="prize-pack-mode" name="prize-pack-mode">
              <option value="per_player" selected>1 per persoon</option>
              <option value="half_boosters">Helft van de boosters</option>
              <option value="equal_boosters">Gelijk aan de boosters</option>
            </select>
            <span class="hint" id="prize-pack-hint">Iedere speler krijgt 1 prijspakket</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Marge</legend>
        <div class="field-grid three">
          <label class="field">
            <span class="field-label">Minimum</span>
            <span class="input-affix suffix">
              <input id="min-margin" name="min-margin" type="text" inputmode="decimal" value="30" required>
              <span class="affix" aria-hidden="true">%</span>
            </span>
          </label>
          <label class="field">
            <span class="field-label">Doel</span>
            <span class="input-affix suffix">
              <input id="target-margin" name="target-margin" type="text" inputmode="decimal" value="30" required>
              <span class="affix" aria-hidden="true">%</span>
            </span>
          </label>
          <label class="field">
            <span class="field-label">Maximum</span>
            <span class="input-affix suffix">
              <input id="max-margin" name="max-margin" type="text" inputmode="decimal" value="40" required>
              <span class="affix" aria-hidden="true">%</span>
            </span>
          </label>
        </div>
        <p class="hint group-hint">Het doel bepaalt hoeveel boosters er uitgaan. Minimum en maximum zijn je grenzen.</p>
      </fieldset>
    </form>

    <section class="results" aria-label="Resultaat">
      <div id="message-banner" class="message-banner hidden" role="alert" aria-live="polite"></div>
      <div id="results-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>

      <div id="results-body" class="results-body">
        <section class="panel outcome" aria-labelledby="outcome-heading">
          <div class="outcome-main">
            <div>
              <h2 id="outcome-heading" class="panel-title">Winst</h2>
              <p id="profit-value" class="big-number">–</p>
            </div>
            <div class="outcome-margin">
              <p class="panel-title">Marge</p>
              <p id="margin-value" class="big-number">–</p>
            </div>
          </div>
          <div class="meter" id="margin-meter" aria-hidden="true">
            <div class="meter-track">
              <div class="meter-band" id="meter-band"></div>
              <div class="meter-marker" id="meter-marker"></div>
            </div>
            <div class="meter-scale" id="meter-scale"></div>
          </div>
          <p id="margin-status" class="status-line"></p>
          <dl id="money-list" class="money-list"></dl>
        </section>

        <div id="warnings" class="warning-list"></div>

        <section class="panel" aria-labelledby="handout-heading">
          <div class="panel-head">
            <h2 id="handout-heading" class="panel-title">Uitdelen</h2>
            <p id="handout-totals" class="panel-meta"></p>
          </div>
          <table class="prize-table">
            <thead>
              <tr>
                <th scope="col">Plaats</th>
                <th scope="col" class="num">Boosters</th>
                <th scope="col" class="num">Prijspakketten</th>
              </tr>
            </thead>
            <tbody id="all-places-body"></tbody>
          </table>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
