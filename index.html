<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Prijzentool</title>
  <link rel="stylesheet" href="styles.css">
  <script src="calculator.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div id="message-banner" class="message-banner hidden" role="alert" aria-live="polite"></div>

    <section class="layout-grid">
      <form id="calculator-form" class="surface form-card" novalidate>
        <div class="card-header">
          <div>
            <p class="section-label">Invoer</p>
            <h2>Toernooi-instellingen</h2>
          </div>
          <div class="button-row">
            <button type="submit" class="button filled">Bereken</button>
            <button type="button" id="reset-button" class="button tonal">Reset</button>
            <button type="button" id="theme-toggle" class="button text" aria-label="Schakel donkere modus">🌙 Donker</button>
          </div>
        </div>

        <div class="field-grid">
          <label class="field">
            <span>Aantal spelers</span>
            <input id="players" name="players" type="number" inputmode="numeric" min="1" step="1" value="20" required>
          </label>

          <label class="field">
            <span>Inleggeld (€)</span>
            <input id="entry-fee" name="entry-fee" type="text" inputmode="decimal" value="15.00" required>
          </label>

          <label class="field">
            <span>Booster inkoop (€)</span>
            <input id="booster-cost" name="booster-cost" type="text" inputmode="decimal" value="5.00" required>
          </label>

          <label class="field">
            <span>Top-cut (plaatsen)</span>
            <input id="top-cut" name="top-cut" type="number" inputmode="numeric" min="1" step="1" value="4" required>
          </label>

          <label class="field">
            <span>Doel-marge (%)</span>
            <input id="target-margin" name="target-margin" type="text" inputmode="decimal" value="30" required>
          </label>

          <label class="field">
            <span>Min-marge (%)</span>
            <input id="min-margin" name="min-margin" type="text" inputmode="decimal" value="30" required>
          </label>

          <label class="field">
            <span>Max-marge (%)</span>
            <input id="max-margin" name="max-margin" type="text" inputmode="decimal" value="40" required>
          </label>
        </div>

        <dl class="supporting-list">
          <div>
            <dt>Min spelers</dt>
            <dd>4</dd>
          </div>
          <div>
            <dt>Booster inkoop</dt>
            <dd>Standaard €5,00 (aanpasbaar)</dd>
          </div>
          <div>
            <dt>Deelnameprijs</dt>
            <dd>1 booster + 1 prize pack</dd>
          </div>
          <div>
            <dt>Top-cut</dt>
            <dd>Volledig aanpasbaar (1 t/m aantal spelers)</dd>
          </div>
        </dl>
      </form>

      <section class="results-column">
        <section class="surface details-card">
          <div class="card-header">
            <div>
              <p class="section-label">Verdeling</p>
              <h2>Prijzen per plek</h2>
            </div>
          </div>
          <div id="warnings" class="warning-list"></div>
          <div id="prize-breakdown" class="metric-list"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Plaats</th>
                  <th>Boosters</th>
                  <th>Prize packs</th>
                </tr>
              </thead>
              <tbody id="all-places-body"></tbody>
            </table>
          </div>
        </section>

        <section class="surface overview-card">
          <div class="card-header">
            <div>
              <p class="section-label">Overzicht</p>
              <h2>Resultaat</h2>
            </div>
          </div>
          <div id="summary-cards" class="metric-list" aria-live="polite"></div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
